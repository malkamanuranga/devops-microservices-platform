apiVersion: apps/v1
kind: Deployment
metadata: { name: user-service, namespace: devops-demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      containers:
        - name: user-service
          image: user-service:local
          imagePullPolicy: Never
          ports: [{ containerPort: 8081 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata: { name: user-service, namespace: devops-demo, labels: { app: user-service } }
spec:
  selector: { app: user-service }
  ports: [{ name: http, port: 8081, targetPort: 8081 }]