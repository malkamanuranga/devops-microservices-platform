apiVersion: apps/v1
kind: Deployment
metadata: { name: order-service, namespace: devops-demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service } }
    spec:
      containers:
        - name: order-service
          image: order-service:local
          imagePullPolicy: Never
          env: [{ name: USER_SERVICE_URL, value: "http://user-service:8081" }]
          ports: [{ containerPort: 8082 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata: { name: order-service, namespace: devops-demo, labels: { app: order-service } }
spec:
  selector: { app: order-service }
  ports: [{ name: http, port: 8082, targetPort: 8082 }]